name: Deploy to Cloudflare

# 手动触发：Actions 页面 → Deploy to Cloudflare → Run workflow。
#
# 为什么不挂 push：日常自动部署交给 Cloudflare Workers Builds（连 GitHub 仓库那套），
# 两边同时开会对同一个 Worker 重复部署。每次 push 的类型检查和测试由 ci.yml 负责。
on:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check + regenerate schema
        run: pnpm run build

      - name: Unit tests
        run: pnpm test

      # deploy:cf 会自动建 D1、写 database_id、应用迁移、部署 Worker，
      # 并把下面提供的两个 Secret 写完（值不会被打印）。
      - name: Deploy
        run: pnpm run deploy:cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
